name: workflow

on: [workflow_dispatch, push]

jobs:
  do_it:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt update
          sudo apt install -y \
            nodejs \
            python3 \
            gcc \
            g++ \
            golang \
            rustc

      - name: COMPILE
        run: src/build.sh

      - name: Run Tests
        run: ./helloworldtest run/*
